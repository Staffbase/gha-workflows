name: Release Drafter

on:
  push:
    branches:
      - main

jobs:
  update_release_draft:
    uses: Staffbase/gha-workflows/.github/workflows/template_release_drafter.yml@65f8e7987a0bc997bc2fa3469c277766a3ec7c31 # v19.2.1
    permissions:
      contents: write
      pull-requests: read
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
