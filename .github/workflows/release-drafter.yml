name: Release Drafter

on:
  push:
    branches:
      - main

jobs:
  update_release_draft:
    uses: Staffbase/gha-workflows/.github/workflows/template_release_drafter.yml@e34b2accb1b680216761fee50c88cf606c9da66a # v20.3.0
    permissions:
      contents: write
      pull-requests: read
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
