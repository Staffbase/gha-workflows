name: Release Drafter

on:
  push:
    branches:
      - main

jobs:
  update_release_draft:
    uses: Staffbase/gha-workflows/.github/workflows/template_release_drafter.yml@65e117170c1783df9e7d7490c32ea814e5f97649 # v19.0.0
