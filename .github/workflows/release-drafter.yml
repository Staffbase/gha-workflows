name: Release Drafter

on:
  push:
    branches:
      - main

jobs:
  update_release_draft:
    uses: Staffbase/gha-workflows/.github/workflows/template_release_drafter.yml@884f7cb09b27e5ccec14a93d0335e359a8dae9c9 # v20.0.1
    permissions:
      contents: write
      pull-requests: read
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
