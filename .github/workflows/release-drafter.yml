name: Release Drafter

on:
  push:
    branches:
      - main

jobs:
  update_release_draft:
    uses: Staffbase/gha-workflows/.github/workflows/template_release_drafter.yml@4480e618bd8586edff0e0feb7001cde314df5bd3 # v19.1.0
    permissions:
      contents: write
      pull-requests: read
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
