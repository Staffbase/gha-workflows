name: Release Drafter

on:
  workflow_call:
    inputs:
      config-name:
        required: false
        type: string
        default: "release-drafter.yml"
      name:
        required: false
        type: string
      publish:
        default: false
        required: false
        type: boolean
      tag:
        required: false
        type: string
      version:
        required: false
        type: string
      prerelease:
        required: false
        type: boolean
        default: false
      prerelease-identifier:
        required: false
        type: string
        default: ""
      commitish:
        required: false
        type: string
        default: ""
    secrets:
      token:
        required: false
      client_id:
        required: false
      private_key:
        required: false

jobs:
  update_release_draft:
    name: update release draft
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: read

    env:
      USING_APP_CREDENTIALS: ${{ secrets.client_id != '' && secrets.private_key != '' }}

    steps:
      - name: Get App Token
        if: ${{ env.USING_APP_CREDENTIALS == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: get_token
        with:
          client-id: ${{ secrets.client_id }}
          private-key: ${{ secrets.private_key }}

      - name: Update Release
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          token: ${{ steps.get_token.outputs.token || secrets.token || github.token }}
          config-name: ${{ inputs.config-name }}
          name: ${{ inputs.name }}
          publish: ${{ inputs.publish }}
          tag: ${{ inputs.tag }}
          version: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          prerelease-identifier: ${{ inputs.prerelease-identifier }}
          commitish: ${{ inputs.commitish }}
