name: Stale PRs

on:
  workflow_call:
    inputs:
      close-pr-message:
        default: 'This stale PR was closed because there was no activity.'
        required: false
        type: string
      days-before-pr-stale:
        default: 60
        required: false
        type: number
      delete-branch:
        default: true
        required: false
        type: boolean
      exempt-pr-labels:
        default: ''
        required: false
        type: string
      stale-pr-message:
        default: 'This PR has been automatically marked as stale because there has been no recent activity in the last 60 days. It will be closed in 7 days if no further activity occurs such as removing the label.'
        required: false
        type: string
      stale-pr-label:
        default: 'stale'
        required: false
        type: string
      cleanup-stale-branches:
        default: false
        required: false
        type: boolean
      days-before-branch-stale:
        default: 14
        required: false
        type: number

jobs:
  stale:
    name: stale
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Stale old PRs
        uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          close-pr-message: ${{ inputs.close-pr-message }}
          days-before-pr-stale: ${{ inputs.days-before-pr-stale }}
          days-before-issue-stale: -1
          delete-branch: ${{ inputs.delete-branch }}
          exempt-pr-labels: ${{ inputs.exempt-pr-labels }}
          stale-pr-label: ${{ inputs.stale-pr-label }}
          stale-pr-message: ${{ inputs.stale-pr-message }}

  # actions/stale (above) only deletes a branch when it closes a PR attached
  # to it. Repos that also accumulate branches with no PR at all (e.g. pushed
  # and abandoned) need this separate sweep.
  delete-stale-branches:
    name: delete stale branches
    if: inputs.cleanup-stale-branches
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Delete branches with no commits for N days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS_BEFORE_BRANCH_STALE: ${{ inputs.days-before-branch-stale }}
        run: |
          default_branch=$(gh api "repos/$REPO" --jq .default_branch)
          cutoff=$(date -u -d "$DAYS_BEFORE_BRANCH_STALE days ago" +%s)

          gh api "repos/$REPO/branches" --paginate --jq '.[].name' | while read -r branch; do
            [ "$branch" = "$default_branch" ] && continue

            protected=$(gh api "repos/$REPO/branches/$branch" --jq .protected)
            [ "$protected" = "true" ] && continue

            open_prs=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$branch" --jq 'length')
            [ "$open_prs" != "0" ] && continue

            last_commit_date=$(gh api "repos/$REPO/commits/$branch" --jq .commit.committer.date)
            last_commit_epoch=$(date -u -d "$last_commit_date" +%s)

            if [ "$last_commit_epoch" -lt "$cutoff" ]; then
              echo "Deleting stale branch: $branch (last commit $last_commit_date)"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            fi
          done
