name: Autodev
on:
  workflow_call:
    inputs:
      base:
        default: 'main'
        required: false
        type: string
      branch:
        default: 'dev'
        required: false
        type: string
      comments:
        default: false
        required: false
        type: boolean
      email:
        default: 'staffbot@staffbase.com'
        required: false
        type: string
      failure_comment:
        required: false
        type: string
      failure_label:
        default: 'failed'
        required: false
        type: string
      label:
        default: 'dev'
        required: false
        type: string
      labels:
        default: false
        required: false
        type: boolean
      mergiraf:
        default: true
        required: false
        type: boolean
      success_comment:
        required: false
        type: string
      success_label:
        default: 'successful'
        required: false
        type: string
      user:
        default: 'AutoDev Action'
        required: false
        type: string
    secrets:
      token:
        required: false
      client_id:
        required: false
      private_key:
        required: false

jobs:
  autodev:
    name: Build Dev Branch
    runs-on: ubuntu-slim
    permissions:
      contents: read

    # check to not trigger if dependabot did something or PR was closed or label is not the configured dev label
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.label.name == inputs.label || github.event.action == 'closed')

    env:
      USING_APP_CREDENTIALS: ${{ secrets.client_id != '' && secrets.private_key != '' }}

    steps:
      - name: Get App Token
        if: ${{ env.USING_APP_CREDENTIALS == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: get_token
        with:
          client-id: ${{ secrets.client_id }}
          private-key: ${{ secrets.private_key }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ env.USING_APP_CREDENTIALS == 'true' && steps.get_token.outputs.token || secrets.token }}
          fetch-depth: 0
          fetch-tags: false
          filter: blob:none

      - name: Prepare isolated Mergiraf mise config
        if: inputs.mergiraf
        run: |
          mkdir -p "${RUNNER_TEMP}/autodev-mise"
          cat > "${RUNNER_TEMP}/autodev-mise/mise.toml" <<'EOF'
          [tools]
          "aqua:codeberg.org/mergiraf/mergiraf" = "0.19.1"
          EOF

      - name: Install Mergiraf
        if: inputs.mergiraf
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.13
          working_directory: ${{ runner.temp }}/autodev-mise
          cache: true
          cache_key: autodev-mergiraf-v1-2026.9.13-0.19.1-{{platform}}

      - name: Configure Mergiraf
        if: inputs.mergiraf
        run: |
          mergiraf languages --gitattributes > "${RUNNER_TEMP}/autodev-mise/attributes"
          git config --local merge.mergiraf.name Mergiraf
          git config --local merge.mergiraf.driver 'mergiraf merge --git %O %A %B -s %S -x %X -y %Y -p %P -l %L'
          git config --local merge.conflictStyle diff3
          git config --local core.attributesFile "${RUNNER_TEMP}/autodev-mise/attributes"

      - name: Autodev
        uses: Staffbase/autodev-action@7cce23249487eeb677775f272a9c6d923d9a1621 # v2.10.1
        with:
          base: ${{ inputs.base }}
          branch: ${{ inputs.branch }}
          comments: ${{ inputs.comments }}
          email: ${{ inputs.email }}
          failure_comment: ${{ inputs.failure_comment }}
          failure_label: ${{ inputs.failure_label }}
          label: ${{ inputs.label }}
          labels: ${{ inputs.labels }}
          success_comment: ${{ inputs.success_comment }}
          success_label: ${{ inputs.success_label }}
          token: ${{ env.USING_APP_CREDENTIALS == 'true' && steps.get_token.outputs.token || secrets.token }}
          user: ${{ inputs.user }}
