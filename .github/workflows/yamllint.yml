name: YAMLlint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  yamllint:
    uses: Staffbase/gha-workflows/.github/workflows/template_yaml.yml@884f7cb09b27e5ccec14a93d0335e359a8dae9c9 # v20.0.1
    permissions:
      contents: read
      checks: write
    with:
      target-path: '.github/workflows'
