name: YAMLlint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  yamllint:
    uses: Staffbase/gha-workflows/.github/workflows/template_yaml.yml@65f8e7987a0bc997bc2fa3469c277766a3ec7c31 # v19.2.1
    permissions:
      contents: read
      checks: write
    with:
      target-path: '.github/workflows'
