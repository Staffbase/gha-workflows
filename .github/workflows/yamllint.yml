name: YAMLlint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  yamllint:
    uses: Staffbase/gha-workflows/.github/workflows/template_yaml.yml@e34b2accb1b680216761fee50c88cf606c9da66a # v20.3.0
    permissions:
      contents: read
      checks: write
    with:
      target-path: '.github/workflows'
