name: YAMLlint

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  yamllint:
    uses: Staffbase/gha-workflows/.github/workflows/template_yaml.yml@4480e618bd8586edff0e0feb7001cde314df5bd3 # v19.1.0
    permissions:
      contents: read
      checks: write
    with:
      target-path: '.github/workflows'

  release-drafter-test:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Check Release Drafter authentication
        run: python -m unittest discover -s tests -p 'test_release_drafter.py' -v
