# see: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#enable-auto-merge-on-a-pull-request
name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      force:
        default: false
        required: false
        type: boolean
      strategy:
        default: "squash"
        required: false
        type: string
      update-types:
        description: "Types of version update to allow (possible values are: minor, major, patch)"
        default: "patch,minor"
        required: false
        type: string
      include-pre-release:
        description: "Include pre-release updates"
        default: false
        required: false
        type: boolean
      allow-digest-updates:
        description: "Merge Docker updates that change only the image digest and keep the tag"
        default: true
        required: false
        type: boolean
    secrets:
      client_id:
        description: "Client ID of the GitHub App."
        required: true
      private_key:
        required: true

jobs:
  dependabot:
    name: auto-merge
    runs-on: ubuntu-slim
    permissions: {}
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Get App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: get_token
        with:
          client-id: ${{ secrets.client_id }}
          private-key: ${{ secrets.private_key }}

      - name: Load dependabot metadata
        id: metadata
        # Soft-fail: for non-genuine dependabot PRs (e.g. unverified/rebased commits)
        # fetch-metadata calls setFailed. Swallow it so the check stays green;
        # empty outputs make the merge step below a no-op.
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ steps.get_token.outputs.token }}

      # Dependabot gives a digest-only update either no semver update type or one with an
      # empty previous version (python:3.14 reports semver-patch), and the same happens for a
      # change between non-numeric tags (bookworm-20250908 to bookworm-20250929). The diff
      # tells them apart: with the digests removed, every changed line must be unchanged.
      - name: Detect digest-only Docker update
        id: digest
        if: >-
          inputs.allow-digest-updates &&
          startsWith(steps.metadata.outputs.package-ecosystem, 'docker') &&
          (
            steps.metadata.outputs.update-type == '' ||
            steps.metadata.outputs.previous-version == ''
          )
        run: |
          diff=$(gh pr diff "$PR_URL")
          removed=$(grep -E '^-' <<< "$diff" | grep -vE '^--- ' | sed -E 's/^-//; s/@sha256:[0-9a-f]{64}//g' || true)
          added=$(grep -E '^\+' <<< "$diff" | grep -vE '^\+\+\+ ' | sed -E 's/^\+//; s/@sha256:[0-9a-f]{64}//g' || true)

          if [ -n "$removed" ] && [ "$removed" == "$added" ]; then
            echo "digest-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a digest-only update, skipping."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}

      # previous-version only holds the first dependency of a grouped update, so check
      # every dependency. Fail closed: missing metadata or a previous version that is
      # empty or not numeric (after an optional "v") means no merge.
      - name: Check for 0.x dependencies
        id: versions
        if: ${{ !inputs.include-pre-release }}
        run: |
          if jq -e 'type == "array" and length > 0 and all(.[]; .prevVersion // "" | tostring | ltrimstr("v") | test("^[0-9]") and (test("^0([^0-9]|$)") | not))' <<< "$DEPENDENCIES_JSON" > /dev/null 2>&1; then
            echo "stable-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "At least one dependency is on a 0.x or unknown version, skipping."
          fi
        env:
          DEPENDENCIES_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}

      - name: Enable auto-merge for Dependabot PRs
        if: >-
          (
            (
              inputs.include-pre-release ||
              steps.versions.outputs.stable-only == 'true'
            ) &&
            (
              (
                contains(inputs.update-types, 'major') &&
                steps.metadata.outputs.update-type == 'version-update:semver-major'
              ) ||
              (
                contains(inputs.update-types, 'minor') &&
                steps.metadata.outputs.update-type == 'version-update:semver-minor'
              ) ||
              (
                contains(inputs.update-types, 'patch') &&
                steps.metadata.outputs.update-type == 'version-update:semver-patch'
              )
            )
          ) ||
          steps.digest.outputs.digest-only == 'true'
        run: |
          gh pr review --approve "$PR_URL"

          MERGE_OPTIONS=()

          case "${{ inputs.strategy }}" in
            "rebase")
              MERGE_OPTIONS+=("--rebase")
              ;;
            "merge")
              MERGE_OPTIONS+=("--merge")
              ;;
            *)
              MERGE_OPTIONS+=("--squash")
              ;;
          esac

          if [ "${{ inputs.force }}" == 'true' ]; then
            MERGE_OPTIONS+=("--admin")
          else
            MERGE_OPTIONS+=("--auto")
          fi

          echo "Executing merge command with the options: '${MERGE_OPTIONS[*]}'"
          gh pr merge "$PR_URL" "${MERGE_OPTIONS[@]}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}
