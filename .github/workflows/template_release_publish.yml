name: Release Auto Publish

on:
  workflow_call:
    inputs:
      config-name:
        required: false
        type: string
        default: 'release-drafter.yml'
      tag-prefix:
        required: false
        type: string
        default: 'v'
      tag-suffix:
        required: false
        type: string
        default: ''
    secrets:
      client_id:
        required: true
      private_key:
        required: true
    outputs:
      published:
        value: ${{ jobs.publish_patch_release.outputs.published }}
      tag:
        value: ${{ jobs.publish_patch_release.outputs.tag }}

jobs:
  publish_patch_release:
    name: publish patch-only draft release
    runs-on: ubuntu-slim
    permissions:
      contents: write

    outputs:
      published: ${{ steps.publish.outputs.published }}
      tag: ${{ steps.publish.outputs.tag }}

    steps:
      - name: Get App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: get_token
        with:
          client-id: ${{ secrets.client_id }}
          private-key: ${{ secrets.private_key }}

      # dry-run only: resolves the current draft's version without touching it,
      # so we get major/minor/patch/tag_name straight from release-drafter's own
      # version-resolver instead of re-parsing tag strings ourselves.
      - name: Resolve draft release version
        id: resolve
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: ${{ inputs.config-name }}
          dry-run: true
        env:
          GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}

      - name: Publish draft release if patch-only
        id: publish
        env:
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
          DRAFT_MAJOR: ${{ steps.resolve.outputs.major_version }}
          DRAFT_MINOR: ${{ steps.resolve.outputs.minor_version }}
        run: |
          set -euo pipefail

          TAG_PREFIX="${{ inputs.tag-prefix }}"
          TAG_SUFFIX="${{ inputs.tag-suffix }}"
          REPO="${{ github.repository }}"

          if [ -z "$TAG_NAME" ]; then
            echo "release-drafter could not resolve a draft version, nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # confirm an actual draft release exists for the resolved tag
          IS_DRAFT=$(gh release view "$TAG_NAME" -R "$REPO" --json isDraft --jq .isDraft 2>/dev/null || echo "")

          if [ -z "$IS_DRAFT" ]; then
            echo "No release found for resolved tag ${TAG_NAME}, nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_DRAFT" != "true" ]; then
            echo "Release ${TAG_NAME} is already published, nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # latest published (non-draft, non-prerelease) release, to compare major/minor against
          LATEST_TAG=$(gh release list -R "$REPO" --limit 100 --exclude-drafts --exclude-pre-releases --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"${TAG_PREFIX}\") and endswith(\"${TAG_SUFFIX}\"))] | .[0].tagName // empty")

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous published release found, skipping automatic publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest published release: ${LATEST_TAG}"
          echo "Resolved draft release: ${TAG_NAME} (major=${DRAFT_MAJOR}, minor=${DRAFT_MINOR})"

          LATEST_VERSION="${LATEST_TAG#${TAG_PREFIX}}"
          LATEST_VERSION="${LATEST_VERSION%${TAG_SUFFIX}}"

          pattern="^[0-9]+\.[0-9]+\.[0-9]+$"
          if ! [[ "$LATEST_VERSION" =~ $pattern ]]; then
            echo "Could not parse semantic version from '${LATEST_TAG}', skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r LATEST_MAJOR LATEST_MINOR _ <<< "$LATEST_VERSION"

          if [ "$DRAFT_MAJOR" != "$LATEST_MAJOR" ] || [ "$DRAFT_MINOR" != "$LATEST_MINOR" ]; then
            echo "Draft release ${TAG_NAME} is a major/minor bump over ${LATEST_TAG}, skipping automatic publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publishing patch release ${TAG_NAME} (previous: ${LATEST_TAG})"
          gh release edit "$TAG_NAME" -R "$REPO" --draft=false

          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
        shell: bash
