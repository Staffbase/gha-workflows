name: 'Setup Artifact Registry'
description: 'Federates into Google Artifact Registry and configures Docker, npm and Maven to use it.'
author: 'Staffbase SE'

inputs:
  configure:
    description: 'Comma-separated list of clients to configure: docker, npm, maven. The access token is produced regardless, so a build that passes it on itself can leave this empty.'
    required: false
    default: 'docker'
  workload-identity-provider:
    description: 'Workload Identity Provider to federate through. The default is the Staffbase pool; overriding it is for testing only.'
    required: false
    default: 'projects/753004700074/locations/global/workloadIdentityPools/github/providers/github'
  service-account:
    description: 'Service account to impersonate. The default holds artifactregistry.writer on the publish repositories and reader on the project.'
    required: false
    default: 'github-artifact-publisher@global-iam-436113.iam.gserviceaccount.com'
  docker-registry:
    description: 'Docker registry host to log in to.'
    required: false
    default: 'europe-docker.pkg.dev'
  npm-registry:
    description: 'npm endpoint the credential is written for. Must match the registry the project resolves from.'
    required: false
    default: 'https://europe-npm.pkg.dev/staffbase-artifacts/npm/'
  maven-registry:
    description: 'Maven endpoint the generated settings.xml mirrors all repository requests to.'
    required: false
    default: 'https://europe-maven.pkg.dev/staffbase-artifacts/maven'

outputs:
  access-token:
    description: 'Short-lived Google access token. Pass it to a build that authenticates itself, such as a Docker build secret for an npm install inside the image. Masked in logs, and expires after one hour by default; re-run this action to re-authenticate a job that outlives that.'
    value: ${{ steps.auth.outputs.access_token }}
  maven-settings-path:
    description: 'Path to the job-scoped settings.xml written when `maven` is in `configure`. Pass it to Maven with `--settings`.'
    value: ${{ steps.maven.outputs.settings-path }}

runs:
  using: 'composite'
  steps:
    # The calling job must grant id-token: write. A composite action cannot request
    # a permission for itself, so without it this fails before anything is written.
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
        token_format: access_token
        create_credentials_file: false

    - name: Parse configure list
      id: configure
      shell: bash
      env:
        CONFIGURE: ${{ inputs.configure }}
      run: |
        set -euo pipefail
        docker=false; npm=false; maven=false
        IFS=',' read -ra clients <<< "${CONFIGURE}"
        for client in "${clients[@]}"; do
          client="$(echo -n "${client}" | xargs)"
          [[ -z "${client}" ]] && continue
          case "${client}" in
            docker) docker=true ;;
            npm) npm=true ;;
            maven) maven=true ;;
            *)
              echo "::error::Unknown client '${client}' in 'configure'. Valid values: docker, npm, maven."
              exit 1
              ;;
          esac
        done
        {
          echo "docker=${docker}"
          echo "npm=${npm}"
          echo "maven=${maven}"
        } >> "${GITHUB_OUTPUT}"

    - name: Login to Artifact Registry
      if: steps.configure.outputs.docker == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.docker-registry }}
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    # The credential only. Which registry a project resolves from stays in its own
    # .npmrc, so this does not silently repoint a build.
    - name: Configure npm
      if: steps.configure.outputs.npm == 'true'
      shell: bash
      env:
        NPM_REGISTRY: ${{ inputs.npm-registry }}
        ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
      run: |
        set -euo pipefail
        npmrc="${RUNNER_TEMP}/.npmrc"
        # npm keys an entry by the registry URL without its scheme, and requires a trailing slash.
        registry="${NPM_REGISTRY%/}/"
        key="${registry#https:}"
        umask 077
        {
          echo "${key}:_authToken=${ACCESS_TOKEN}"
          echo "${key}:always-auth=true"
        } > "${npmrc}"
        chmod 600 "${npmrc}"
        echo "NPM_CONFIG_USERCONFIG=${npmrc}" >> "${GITHUB_ENV}"
        echo "::notice::Configured npm credentials for ${NPM_REGISTRY} in a job-scoped ${npmrc}, cleared automatically at the end of the job"

    - name: Configure Maven
      if: steps.configure.outputs.maven == 'true'
      id: maven
      shell: bash
      env:
        MAVEN_REGISTRY: ${{ inputs.maven-registry }}
        ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
      run: |
        set -euo pipefail
        m2_dir="${RUNNER_TEMP}/m2"
        settings="${m2_dir}/settings.xml"
        mkdir -p "${m2_dir}"
        umask 077
        cat > "${settings}" <<XML
        <settings>
          <servers>
            <server>
              <id>artifact-registry</id>
              <username>oauth2accesstoken</username>
              <password>${ACCESS_TOKEN}</password>
            </server>
          </servers>
          <mirrors>
            <mirror>
              <id>artifact-registry</id>
              <mirrorOf>*</mirrorOf>
              <url>${MAVEN_REGISTRY}</url>
            </mirror>
          </mirrors>
        </settings>
        XML
        chmod 600 "${settings}"
        echo "settings-path=${settings}" >> "${GITHUB_OUTPUT}"
        echo "::notice::Wrote Maven credentials for ${MAVEN_REGISTRY} to a job-scoped ${settings}, cleared automatically at the end of the job. Pass it to Maven with: mvn --settings ${settings}"
